[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-parchino-backend"
version = "0.1.0"
description = "FastAPI backend for Wiki Parchino"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
  { name = "Francesco Borri" },
]
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<0.28",
  "pydantic>=2.8",
  "python-dotenv[cli]>=1.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
